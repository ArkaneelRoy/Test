name: Multi-Platform Flutter CI Build
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build Target'
        required: true
        default: 'android-arm64'
        type: choice
        options:
          - android-arm64
          - android-armv7
          - linux
          - windows
          - macos

jobs:
  build-android:
    name: Build Android (${{ inputs.target }})
    if: startsWith(inputs.target, 'android')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Compile APK
        run: |
          if [ "${{ inputs.target }}" = "android-armv7" ]; then
            flutter build apk --release --target-platform=android-arm --android-skip-build-dependency-validation
          else
            flutter build apk --release --target-platform=android-arm64 --android-skip-build-dependency-validation
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.target }}-release
          path: build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    name: Build Linux Desktop
    if: inputs.target == 'linux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Linux Bundle
        run: tar -czf linux-release.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: linux-release.tar.gz

  build-windows:
    name: Build Windows Desktop
    if: inputs.target == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows Bundle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows-release.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: windows-release.zip

  build-macos:
    name: Build macOS Desktop
    if: inputs.target == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --no-codesign
      - name: Package macOS App
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y macos-release.zip *.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/macos/Build/Products/Release/macos-release.zip
